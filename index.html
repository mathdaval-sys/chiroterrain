<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163026">
<title>ChiroTerrain</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{--bg:#163026;--fg:#f0f0eb;--st:#1e6fd9;--ar:#2e9d4a;--ob:#e8851a;--bad:#d93025;--warn:#e8a11a;--ok:#2e9d4a;--card:#fff;--txt:#1d1d1b;--mut:#6b6b66;--line:#e2e2dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg);overscroll-behavior:none}
body{display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--bg);color:var(--fg);z-index:1000}
#top button{background:none;border:0;color:var(--fg);font:inherit}
#btnMenu{font-size:26px;width:44px;height:44px;line-height:1}
#btnSite{flex:1;min-width:0;text-align:left;padding:4px 6px;border-radius:8px}
#btnSite small{display:block;font-size:11px;opacity:.7}
#btnSite b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
#gpsChip{font-size:13px;font-weight:600;padding:6px 10px;border-radius:16px;background:#555;white-space:nowrap}
#gpsChip.ok{background:var(--ok)}#gpsChip.warn{background:var(--warn);color:#222}#gpsChip.bad{background:var(--bad)}
#map{flex:1;background:#2a2a2a}
#bottom{display:flex;gap:6px;padding:6px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:var(--bg);z-index:1000}
#bottom button{flex:1;border:0;border-radius:12px;color:#fff;font-size:15px;font-weight:700;padding:14px 4px;line-height:1.15}
#bottom button span{display:block;font-size:11px;font-weight:500;opacity:.9}
.b-st{background:var(--st)}.b-ar{background:var(--ar)}.b-ob{background:var(--ob)}
#fab{position:absolute;right:10px;bottom:90px;z-index:900;display:flex;flex-direction:column;gap:8px}
#fab button{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:12px;font-weight:700;color:#163026}
#fab button.on{background:var(--st);color:#fff}
/* Marqueurs */
.mkw{background:none;border:0}
.mk{position:absolute;transform:translate(-50%,-50%);color:#fff;font-weight:700;font-size:12px;line-height:1;padding:5px 6px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap}
.mk-station{background:var(--st);border-radius:4px}
.mk-station.off{background:#7d7d7d}
.mk-arbre{background:var(--ar);border-radius:50%;min-width:26px;text-align:center}
.mk-obs{background:var(--ob);border-radius:50% 50% 50% 0}
.gpsdot{width:18px;height:18px;border-radius:50%;background:#2b7cff;border:3px solid #fff;box-shadow:0 0 0 2px rgba(43,124,255,.4);transform:translate(-50%,-50%);position:absolute}
.site-label{background:rgba(0,0,0,.6);color:#ffd400;border:0;box-shadow:none;font-weight:700;font-size:12px;padding:2px 6px}
.site-label:before{display:none}
.hide-labels .site-label{display:none}
/* Viseur */
#cross{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:950;pointer-events:none;display:none}
#cross:before,#cross:after{content:"";position:absolute;background:#ff2d2d;box-shadow:0 0 0 1px #fff}
#cross:before{left:21px;top:0;width:2px;height:44px}#cross:after{top:21px;left:0;height:2px;width:44px}
#crossBar{position:absolute;left:8px;right:8px;bottom:90px;z-index:960;background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.4);display:none}
#crossBar p{margin:0 0 8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
/* Feuilles */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;z-index:2001;padding:14px 14px max(18px,env(safe-area-inset-bottom));display:none;-webkit-overflow-scrolling:touch}
#sheet h2{margin:0 0 10px;font-size:19px}
#sheet h3{margin:16px 0 6px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
#sheet p{margin:6px 0}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 12px;font-size:16px;font-weight:600;background:#ececE6;color:var(--txt);margin:6px 0;text-align:center;text-decoration:none}
.btn.pri{background:var(--bg);color:#fff}.btn.st{background:var(--st);color:#fff}.btn.ar{background:var(--ar);color:#fff}.btn.ob{background:var(--ob);color:#fff}
.btn.dan{background:var(--bad);color:#fff}.btn:disabled{opacity:.45}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:2px}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:600;color:var(--mut)}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid #c9c9c2;border-radius:8px;background:#fff;color:var(--txt);font-family:inherit}
textarea{min-height:70px}
.inl{display:flex;gap:6px}.inl>input{flex:1;min-width:0}.inl>button{flex:none;width:auto;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid #c9c9c2;background:#fff;border-radius:18px;padding:8px 12px;font-size:14px;color:var(--txt)}
.chips button.on{background:var(--bg);color:#fff;border-color:var(--bg)}
.list{margin:0;padding:0;list-style:none}
.list li{border-bottom:1px solid var(--line);padding:10px 2px;display:flex;gap:8px;align-items:center}
.list li .t{flex:1;min-width:0}
.list li .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list li .t small{color:var(--mut)}
.list li.act{background:#fff8d6}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.kv td:first-child{color:var(--mut);width:40%}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumbs div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:6px;display:block}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:2px 5px;margin-right:3px}
.bg-st{background:var(--st)}.bg-ar{background:var(--ar)}.bg-ob{background:var(--ob)}.bg-mu{background:#888}
.prog{height:10px;background:#e5e5e0;border-radius:5px;overflow:hidden;margin:10px 0}
.prog div{height:100%;background:var(--ar);width:0}
.mut{color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:3000;font-size:14px;display:none;max-width:90vw;text-align:center}
#updBar{display:none;background:var(--warn);color:#222;padding:8px;text-align:center;font-size:14px;z-index:1001}
#updBar button{margin-left:8px}
#photoView{position:fixed;inset:0;background:#000;z-index:4000;display:none;align-items:center;justify-content:center}
#photoView img{max-width:100%;max-height:100%}
.leaflet-control-layers-toggle{width:44px;height:44px}
</style>
</head>
<body>
<div id="updBar">Nouvelle version disponible <button class="btn sm pri" id="btnUpd">Mettre à jour</button></div>
<div id="top">
  <button id="btnMenu" aria-label="Menu">&#9776;</button>
  <button id="btnSite"><small>Site actif</small><b id="siteName">Aucun site</b></button>
  <div id="gpsChip">GPS…</div>
</div>
<div id="map"></div>
<div id="fab">
  <button id="btnFollow" title="Suivre ma position">GPS</button>
  <button id="btnFit" title="Voir le site actif">SITE</button>
</div>
<div id="cross"></div>
<div id="crossBar"></div>
<div id="bottom">
  <button class="b-st" data-add="station">+ Station<span>enregistreur</span></button>
  <button class="b-ar" data-add="arbre">+ Arbre<span>gîte potentiel</span></button>
  <button class="b-ob" data-add="obs">+ Observation<span>bâti, grotte, pont…</span></button>
</div>
<div id="backdrop"></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="photoView"><img alt=""></div>
<script src="lib/leaflet.js"></script>
<script src="lib/proj4.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
